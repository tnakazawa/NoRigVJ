<!doctype html>
<html lang="ja">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>NoRigVJ - Control</title>
    <style>
      html, body {
        margin: 0;
        height: 100%;
        background: #111;
        color: #eee;
        font: 14px/1.5 system-ui, sans-serif;
        overflow: hidden;
      }
      #app {
        display: flex;
        height: 100vh;
      }
      #main-area {
        flex: 1 1 auto;
        min-width: 0;
        display: flex;
        flex-direction: column;
      }
      #displays-list {
        flex: 1 1 auto;
        overflow-y: auto;
        padding: 16px;
        display: flex;
        flex-direction: column;
        gap: 12px;
      }
      #displays-empty {
        opacity: 0.5;
        padding: 8px;
      }
      .display-row {
        display: flex;
        gap: 12px;
        align-items: center;
        background: #1a1a1a;
        border: 1px solid #333;
        border-radius: 6px;
        padding: 8px;
      }
      .display-preview {
        position: relative;
        width: 220px;
        aspect-ratio: 16 / 9;
        background: #000;
        flex: 0 0 auto;
        border-radius: 4px;
        overflow: hidden;
      }
      .display-preview canvas {
        position: absolute;
        inset: 0;
        display: block;
        width: 100%;
        height: 100%;
      }
      .display-row-controls {
        display: flex;
        flex-direction: column;
        gap: 6px;
        flex: 1 1 auto;
        min-width: 0;
      }
      .display-row-label {
        font-size: 12px;
        opacity: 0.7;
      }
      .display-row-controls select {
        background: #222;
        color: #eee;
        border: 1px solid #444;
        border-radius: 4px;
        padding: 6px 8px;
        font: inherit;
      }
      .close-btn {
        align-self: flex-start;
      }
      #panel {
        flex: 0 0 260px;
        padding: 16px;
        display: flex;
        flex-direction: column;
        gap: 16px;
        overflow-y: auto;
        box-sizing: border-box;
      }
      h1 {
        font-size: 15px;
        margin: 0;
        opacity: 0.7;
      }
      section {
        display: flex;
        flex-direction: column;
        gap: 8px;
      }
      button {
        background: #222;
        color: #eee;
        border: 1px solid #444;
        border-radius: 4px;
        padding: 8px 10px;
        cursor: pointer;
        font: inherit;
        text-align: left;
      }
      button:hover {
        border-color: #888;
      }
      input[type="range"] {
        width: 100%;
      }
      #status {
        font-size: 12px;
        opacity: 0.8;
      }
    </style>
  </head>
  <body>
    <div id="app">
      <div id="main-area">
        <div id="displays-list">
          <div id="displays-empty">投影窓がありません。「投影窓を追加」から開始してください。</div>
        </div>
      </div>
      <div id="panel">
        <h1>NoRigVJ Control</h1>
        <section>
          <strong>強度: <span id="intensity-value">1.0</span></strong>
          <input type="range" id="intensity" min="0" max="3" step="0.1" value="1" />
        </section>
        <section>
          <button id="mic-toggle">マイク有効化 (Space)</button>
        </section>
        <section>
          <button id="add-display">投影窓を追加</button>
          <div id="status">投影窓: 0枚接続中</div>
        </section>
      </div>
    </div>
    <script type="module" src="/src/control.ts"></script>
  </body>
</html>
