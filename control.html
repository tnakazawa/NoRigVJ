<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>NoRigVJ - Control</title>
    <style>
      html, body {
        margin: 0;
        height: 100%;
        background: #111;
        color: #eee;
        font: 14px/1.5 system-ui, sans-serif;
        overflow: hidden;
      }
      #app {
        display: flex;
        height: 100vh;
      }
      #main-area {
        flex: 1 1 auto;
        min-width: 0;
        display: flex;
        flex-direction: column;
      }
      #displays-list {
        flex: 1 1 auto;
        overflow-y: auto;
        padding: 16px;
        display: flex;
        flex-wrap: wrap;
        align-content: flex-start;
        gap: 12px;
      }
      #displays-empty {
        opacity: 0.5;
        padding: 8px;
      }
      .display-row {
        position: relative;
        display: flex;
        flex-direction: column;
        gap: 10px;
        background: #1a1a1a;
        border: 1px solid #333;
        border-radius: 6px;
        padding: 8px;
        flex: 1 1 520px;
        max-width: calc(50% - 6px);
      }
      .preview-group {
        display: flex;
        gap: 8px;
        width: 100%;
      }
      .preview-slot {
        display: flex;
        flex-direction: column;
        gap: 4px;
        min-width: 0;
      }
      /* Current:Next ≒ 300:190 の比率を保ったまま、枠の幅いっぱいに広がる */
      .preview-slot.current-slot {
        flex: 1 1 0;
      }
      .preview-slot.pending-slot {
        flex: 0.63 0.63 0;
      }
      .preview-slot-label {
        font-size: 11px;
        opacity: 0.6;
        text-align: center;
      }
      .display-preview {
        position: relative;
        width: 100%;
        aspect-ratio: 16 / 9;
        background: #000;
        border-radius: 4px;
        overflow: hidden;
      }
      .display-preview canvas {
        position: absolute;
        inset: 0;
        display: block;
        width: 100%;
        height: 100%;
      }
      .display-row-controls {
        display: flex;
        flex-direction: column;
        gap: 8px;
      }
      .control-row {
        display: flex;
        gap: 6px;
        align-items: center;
        flex-wrap: wrap;
      }
      .display-row-label {
        font-size: 12px;
        opacity: 0.7;
      }
      .display-row-controls select {
        background: #222;
        color: #eee;
        border: 1px solid #444;
        border-radius: 4px;
        padding: 6px 8px;
        font: inherit;
      }
      .display-row-controls select:disabled {
        opacity: 0.4;
        cursor: not-allowed;
      }
      .palette-row {
        display: flex;
        gap: 6px;
        align-items: center;
        flex-wrap: wrap;
      }
      .palette-dropdown {
        position: relative;
        flex: 1 1 80px;
        min-width: 60px;
      }
      .palette-dropdown-trigger {
        width: 100%;
        display: flex;
        align-items: center;
        gap: 6px;
      }
      .palette-dropdown-label {
        overflow: hidden;
        text-overflow: ellipsis;
        white-space: nowrap;
      }
      /* セレクトボックスだと分かるよう、ネイティブselectの矢印相当を右端に出す */
      .palette-dropdown-trigger::after {
        content: "▾";
        margin-left: auto;
        opacity: 0.6;
        flex: 0 0 auto;
      }
      .palette-dropdown-list {
        position: absolute;
        top: 100%;
        left: 0;
        z-index: 20;
        margin-top: 2px;
        width: max-content;
        min-width: 100%;
        max-height: 300px;
        overflow-y: auto;
        background: #222;
        border: 1px solid #444;
        border-radius: 4px;
      }
      .palette-dropdown-option {
        display: flex;
        align-items: center;
        gap: 6px;
        padding: 6px 8px;
        cursor: pointer;
        white-space: nowrap;
      }
      .palette-dropdown-option:hover {
        background: #333;
      }
      .palette-dropdown-option.selected {
        background: #2d6a4f;
      }
      .palette-swatch-pair {
        display: inline-flex;
        gap: 2px;
        flex: 0 0 auto;
      }
      .palette-swatch {
        width: 12px;
        height: 12px;
        border-radius: 2px;
        border: 1px solid rgba(255, 255, 255, 0.25);
      }
      .palette-swatch-empty {
        background: none;
      }
      .preset-row {
        display: flex;
        gap: 6px;
        align-items: center;
        flex-wrap: wrap;
      }
      .preset-row select {
        flex: 1 1 80px;
        min-width: 60px;
      }
      .preset-row button {
        flex: 0 0 auto;
        padding: 6px 8px;
      }
      input[type="color"] {
        width: 30px;
        height: 30px;
        padding: 0;
        border: 1px solid #444;
        border-radius: 4px;
        background: none;
        cursor: pointer;
        flex: 0 0 auto;
      }
      input[type="color"]:disabled {
        opacity: 0.4;
        cursor: not-allowed;
      }
      .close-btn {
        position: absolute;
        top: 8px;
        right: 8px;
        width: 24px;
        height: 24px;
        padding: 0;
        display: flex;
        align-items: center;
        justify-content: center;
        line-height: 1;
        font-size: 12px;
        border-radius: 50%;
        z-index: 1;
      }
      #panel {
        flex: 0 0 320px;
        padding: 16px;
        display: flex;
        flex-direction: column;
        gap: 16px;
        overflow-y: auto;
        box-sizing: border-box;
      }
      .panel-footer {
        margin-top: auto;
      }
      h1 {
        font-size: 15px;
        margin: 0;
        opacity: 0.7;
      }
      section {
        display: flex;
        flex-direction: column;
        gap: 8px;
      }
      button {
        background: #222;
        color: #eee;
        border: 1px solid #444;
        border-radius: 4px;
        padding: 8px 10px;
        cursor: pointer;
        font: inherit;
        text-align: left;
      }
      .trigger-btn {
        padding: 16px 10px;
      }
      button:hover {
        border-color: #888;
      }
      button:disabled {
        opacity: 0.4;
        cursor: not-allowed;
      }
      .crossfade-btn,
      .primary-btn {
        background: #2d6a4f;
        border-color: #52b788;
      }
      .crossfade-btn {
        text-align: center;
        flex: 1 1 auto;
      }
      input[type="range"] {
        width: 100%;
      }
      #status {
        font-size: 12px;
        opacity: 0.8;
      }
    </style>
  </head>
  <body>
    <div id="app">
      <div id="main-area">
        <div id="displays-list">
          <div id="displays-empty">No displays yet. Click "Add Display" to start.</div>
        </div>
      </div>
      <div id="panel">
        <h1>NoRigVJ Control</h1>
        <section>
          <strong>Intensity: <span id="intensity-value">1.0</span></strong>
          <input type="range" id="intensity" min="0" max="9" step="0.1" value="1" />
        </section>
        <section>
          <strong>Crossfade duration: <span id="crossfade-duration-value">1.0</span>s</strong>
          <input type="range" id="crossfade-duration" min="0" max="16" step="0.1" value="1" />
        </section>
        <section>
          <button id="trigger-1" class="trigger-btn">Trigger 1 (Space)</button>
          <button id="trigger-2" class="trigger-btn">Trigger 2 (Cmd Right / Ctrl Right)</button>
          <button id="trigger-3" class="trigger-btn">Trigger 3 (Cmd Left / Ctrl Left)</button>
        </section>
        <section>
          <button id="random-btn" class="primary-btn">Random</button>
        </section>
        <section>
          <strong>Auto interval: <span id="auto-interval-value">5</span>m</strong>
          <input type="range" id="auto-interval" min="1" max="240" step="1" value="5" />
          <button id="auto-toggle-btn">Auto: OFF</button>
        </section>
        <section class="panel-footer">
          <button id="mic-toggle">Enable Mic (M)</button>
          <button id="add-display" class="primary-btn">Add Display</button>
          <div id="status">Displays: 0 connected</div>
        </section>
      </div>
    </div>
    <script type="module" src="/src/control.ts"></script>
  </body>
</html>
