<!doctype html>
<html lang="ja">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>NoRigVJ - Control</title>
    <style>
      html, body {
        margin: 0;
        height: 100%;
        background: #111;
        color: #eee;
        font: 14px/1.5 system-ui, sans-serif;
        overflow: hidden;
      }
      #app {
        display: flex;
        height: 100vh;
      }
      #preview-wrap {
        flex: 1 1 auto;
        position: relative;
        background: #000;
        min-width: 0;
      }
      #preview {
        display: block;
        width: 100%;
        height: 100%;
      }
      #hud {
        position: absolute;
        left: 12px;
        bottom: 12px;
        color: #0f0;
        font: 12px/1.4 monospace;
        opacity: 0.8;
        pointer-events: none;
        white-space: pre;
      }
      #panel {
        flex: 0 0 260px;
        padding: 16px;
        display: flex;
        flex-direction: column;
        gap: 16px;
        overflow-y: auto;
        box-sizing: border-box;
      }
      h1 {
        font-size: 15px;
        margin: 0;
        opacity: 0.7;
      }
      section {
        display: flex;
        flex-direction: column;
        gap: 8px;
      }
      #scene-buttons {
        display: flex;
        flex-direction: column;
        gap: 6px;
      }
      button {
        background: #222;
        color: #eee;
        border: 1px solid #444;
        border-radius: 4px;
        padding: 8px 10px;
        cursor: pointer;
        font: inherit;
        text-align: left;
      }
      button.active {
        background: #2d6a4f;
        border-color: #52b788;
      }
      button:hover {
        border-color: #888;
      }
      input[type="range"] {
        width: 100%;
      }
      #status {
        font-size: 12px;
        opacity: 0.8;
      }
    </style>
  </head>
  <body>
    <div id="app">
      <div id="preview-wrap">
        <canvas id="preview"></canvas>
        <div id="hud"></div>
      </div>
      <div id="panel">
        <h1>NoRigVJ Control</h1>
        <section>
          <strong>シーン</strong>
          <div id="scene-buttons"></div>
        </section>
        <section>
          <strong>強度: <span id="intensity-value">1.0</span></strong>
          <input type="range" id="intensity" min="0" max="3" step="0.1" value="1" />
        </section>
        <section>
          <button id="mic-toggle">マイク有効化 (Space)</button>
        </section>
        <section>
          <button id="open-display">投影窓を開く</button>
          <div id="status">投影窓: 未接続</div>
        </section>
      </div>
    </div>
    <script type="module" src="/src/control.ts"></script>
  </body>
</html>
